# DYPOL style guide — Engine B (Shorts, 9:16). Machine-readable rules.
# Source: DYPOL style guide proposal v0.1 (1 Nov 2026), sections (b), (c) and "DYPOL's own look".
# Loaded by verticals/style.py (the only module that reads this file).
version: 1
engine: shorts

pace:
  target_wpm: 158              # am_michael at speed 1.08 measures ~156 WPM (voice test, 3 Nov 2026)
  min_wpm: 150
  max_wpm: 165

voice:                         # brand narration voice (shared with Engine A for consistency)
  provider: kokoro             # Kokoro-82M, local, Apache-2.0 model
  kokoro_voice: am_michael     # natural American male; best intelligibility at 2x-2.5x playback
  kokoro_speed: 1.08           # ~156 WPM, pauses at every comma and full stop
  lang: en-us
  lead_silence_max_s: 0.12     # trim TTS lead-in so the first word lands well inside 0.8 s
  edge_fallback_en: en-US-GuyNeural  # emergency fallback only (unofficial endpoint, see notes)
  # Overrides: $DYPOL_VOICE / $DYPOL_VOICE_SPEED beat this block; the old $KOKORO_VOICE /
  # $KOKORO_SPEED (the workflow sets af_heart by default) apply only when this block has no voice.
  # Measurements: notes/voice-choice-2026-11-03.md in the DYPOL project.

screen:
  width: 1080
  height: 1920
  fps: 30
  change_every_s: [2.0, 4.0]   # something changes on screen every 2-4 s
  max_static_s: 3.5            # nothing static for longer than this

variety:
  max_same_kind_in_a_row: 2    # never 3 blocks of the same kind in a row
  max_kinetic_share: 0.30      # plain kinetic_text is at most 30% of the runtime
  max_stock_beats: 2           # stock_or_ai_still for at most 2 beats
  min_count_up: 1              # every Short shows at least one sourced on-screen number

structure:                     # hook -> how it works (2-3 beats) -> the catch -> takeaway
  roles: [hook, how, catch, takeaway]
  final_block_motion: true     # the last beat is a motion takeaway card, never a still

hook:
  first_word_by_s: 0.8         # first spoken word by 0.8 s (checked on the Whisper timings after render)
  max_words: 12                # sentence 1 is one plain conversational sentence of at most 12 words
  banned_phrases:              # setup that makes the opening (first 2 sentences) read oddly (piece 5)
    - "let me explain"
    - "let me break"
    - "in sixty seconds"
    - "in 60 seconds"
    - "that is how"
    - "that's how"
    - "most people get this wrong"
    - "you won't believe"
    - "buckle up"
  filler_phrases:              # empty filler lines, banned anywhere in the script
    - "here is the thing"
    - "here's the thing"
    - "the thing is"
    - "let me explain"
    - "in sixty seconds"
  stakes_by_s: 3.0             # why it matters, said by 3 s
  number_by_s: 8.0             # one concrete number by 8 s
  no_intro: true
  no_end_cta: true             # no subscribe/like/follow ask at the end
  stock_allowed_in_hook: false # the opening block is a proof block, never stock

blocks:
  kinds: [kinetic_text, count_up, code_panel, diagram, stock_or_ai_still]
  default_fallback: stock_or_ai_still
  limits:
    kinetic_text: {min_words: 1, max_words: 4}
    code_panel: {max_lines: 6, max_line_chars: 34}
    diagram: {min_nodes: 2, max_nodes: 4}

look:
  palette:
    background: "#0F141C"   # deep slate
    panel: "#161D27"
    border: "#26303D"
    body: "#EEF2F6"         # off-white
    muted: "#8A97A8"
    lime: "#C8F560"         # the point / new / winner
    cyan: "#4CC9F0"         # the product / system
    amber: "#FFB547"        # caveat / the catch
  panel_radius: 14
  label_bar_px: 6
  fonts:                    # OFL, vendored in style/fonts with their licence files
    display_bold: fonts/SpaceGrotesk-Bold.ttf
    display_medium: fonts/SpaceGrotesk-Medium.ttf
    mono: fonts/JetBrainsMono-Regular.ttf
    mono_bold: fonts/JetBrainsMono-Bold.ttf
  licences:
    - fonts/SpaceGrotesk-OFL.txt
    - fonts/JetBrainsMono-OFL.txt
