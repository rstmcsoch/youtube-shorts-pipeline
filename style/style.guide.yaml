# DYPOL style guide — Engine B (Shorts, 9:16). Machine-readable rules.
# Source: DYPOL style guide proposal v0.1 (1 Nov 2026), sections (b), (c) and "DYPOL's own look".
# Loaded by verticals/style.py (the only module that reads this file).
version: 1
engine: shorts

pace:
  target_wpm: 165
  min_wpm: 155
  max_wpm: 175

screen:
  width: 1080
  height: 1920
  fps: 30
  change_every_s: [2.0, 4.0]   # something changes on screen every 2-4 s
  max_static_s: 3.5            # nothing static for longer than this

variety:
  max_same_kind_in_a_row: 2    # never 3 blocks of the same kind in a row

hook:
  first_word_by_s: 0.5         # no intro, no silence before the first word
  stakes_by_s: 3.0             # why it matters, said by 3 s
  number_by_s: 8.0             # one concrete number by 8 s
  no_intro: true
  no_end_cta: true             # no subscribe/like/follow ask at the end
  stock_allowed_in_hook: false # the opening block is a proof block, never stock

blocks:
  kinds: [kinetic_text, count_up, code_panel, diagram, stock_or_ai_still]
  default_fallback: stock_or_ai_still
  limits:
    kinetic_text: {min_words: 1, max_words: 4}
    code_panel: {max_lines: 6, max_line_chars: 34}
    diagram: {min_nodes: 2, max_nodes: 4}

look:
  palette:
    background: "#0F141C"   # deep slate
    panel: "#161D27"
    border: "#26303D"
    body: "#EEF2F6"         # off-white
    muted: "#8A97A8"
    lime: "#C8F560"         # the point / new / winner
    cyan: "#4CC9F0"         # the product / system
    amber: "#FFB547"        # caveat / the catch
  panel_radius: 14
  label_bar_px: 6
  fonts:                    # OFL, vendored in style/fonts with their licence files
    display_bold: fonts/SpaceGrotesk-Bold.ttf
    display_medium: fonts/SpaceGrotesk-Medium.ttf
    mono: fonts/JetBrainsMono-Regular.ttf
    mono_bold: fonts/JetBrainsMono-Bold.ttf
  licences:
    - fonts/SpaceGrotesk-OFL.txt
    - fonts/JetBrainsMono-OFL.txt
