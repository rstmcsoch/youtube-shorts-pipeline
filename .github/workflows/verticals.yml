name: DYPOL Verticals production
# The console matches runs to jobs by display_title, so it carries the job id and phase.
run-name: "${{ inputs.job_id || github.run_id }} (${{ inputs.phase || 'n/a' }})"

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Draft only, publish a saved draft, or full (only with auto-publish enabled)'
        required: true
        default: 'draft'
        type: choice
        options: [draft, publish, full]
      topic:
        description: 'Topic to create; leave blank for auto-discovery'
        required: false
        default: ''
      context:
        description: 'Optional channel context for the script'
        required: false
        default: ''
      niche:
        description: 'Content niche slug'
        required: true
        default: 'tech'
      language:
        description: 'Voice and captions language'
        required: true
        default: 'en'
        type: choice
        options: [en, hi, es, pt, de, fr, ja, ko]
      privacy:
        description: 'YouTube visibility; private is recommended for first tests'
        required: true
        default: 'private'
        type: choice
        options: [private, unlisted, public]
      job_id:
        description: 'DYPOL job ID connecting draft and publish'
        required: false
        default: ''
      draft_run_id:
        description: 'Producing run ID if no durable draft snapshot is available'
        required: false
        default: ''
      title_override:
        description: 'Reviewed title override'
        required: false
        default: ''
      description_override:
        description: 'Reviewed description override'
        required: false
        default: ''
      tags_override:
        description: 'Reviewed comma-separated tags'
        required: false
        default: ''
      review_required:
        description: 'Keep 1 to block full-phase publishing'
        required: true
        default: '1'
      auto_publish:
        description: 'Set 1 only after intentionally enabling automatic uploads'
        required: true
        default: '0'
      reviewer_feedback:
        description: 'Reviewer notes from a rejected attempt (redo); max 1500 chars are used'
        required: false
        default: ''
        type: string

concurrency:
  group: dypol-verticals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  produce:
    if: ${{ github.event_name == 'schedule' || inputs.phase != 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      VERTICALS_HOME: ${{ github.workspace }}/.verticals-runtime
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DYPOL_JOB_ID: ${{ inputs.job_id || github.run_id }}
      TOPIC: ${{ inputs.topic || '' }}
      NICHE: ${{ inputs.niche || 'tech' }}
      CONTEXT: ${{ inputs.context || '' }}
      LANGUAGE: ${{ inputs.language || 'en' }}
      KOKORO_MODEL_DIR: ${{ github.workspace }}/.kokoro-cache
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'af_heart' }}
      KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.08' }}
      MUSIC_ENABLED: ${{ vars.MUSIC_ENABLED || '0' }}
      REVIEWER_FEEDBACK: ${{ inputs.reviewer_feedback || '' }}
      # Unbuffered output: per-stage timings in the log line up with real time.
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Speed: the old setup-python pip cache restored ~3.5 GB (~40 s) and then still
      # spent ~50 s in pip install. Caching the installed virtualenv skips both on a hit.
      - name: Cache Python virtualenv (CPU torch + requirements)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/.venv-dypol
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-torchcpu-v1

      - name: Install system video tools and caption fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          # Brand caption font; captions fall back to DejaVu Sans Bold if this fails.
          sudo apt-get install -y --no-install-recommends fonts-montserrat || echo "::warning::fonts-montserrat unavailable; captions use DejaVu Sans Bold"
          fc-cache -f >/dev/null 2>&1 || true
          fc-list : family | grep -iE "montserrat|dejavu sans" | sort -u | head -5 || true

      - name: Install Python dependencies and compile-check
        env:
          VENV_CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${VENV_CACHE_HIT:-}" != "true" ]; then
            python -m venv ~/.venv-dypol
            ~/.venv-dypol/bin/python -m pip install --upgrade pip
            # CPU-only torch for Whisper: far smaller/faster than the default CUDA wheels.
            ~/.venv-dypol/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
            ~/.venv-dypol/bin/pip install -r requirements.txt
          else
            echo "Restored cached virtualenv; pip install skipped."
          fi
          echo "$HOME/.venv-dypol/bin" >> "$GITHUB_PATH"
          ~/.venv-dypol/bin/python -m compileall -q verticals scripts

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-base-v1

      - name: Cache Kokoro-82M model files
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: .kokoro-cache
          key: kokoro-onnx-model-files-v1.0

      - name: Download Kokoro-82M model files (official kokoro-onnx release)
        if: ${{ steps.kokoro-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$KOKORO_MODEL_DIR"
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL --retry 3 -o "$KOKORO_MODEL_DIR/kokoro-v1.0.onnx" "$BASE/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 -o "$KOKORO_MODEL_DIR/voices-v1.0.bin" "$BASE/voices-v1.0.bin"
          cd "$KOKORO_MODEL_DIR"
          printf '%s  %s\n' \
            7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5 kokoro-v1.0.onnx \
            bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d voices-v1.0.bin | sha256sum -c -

      - name: Validate DYPOL job ID and Gemini key
        run: |
          set -euo pipefail
          if ! [[ "$DYPOL_JOB_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::DYPOL job_id may contain only letters, numbers, dot, underscore, and hyphen."
            exit 2
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Gemini API key is not available to this workflow. Add a repository Actions secret named GEMINI_API_KEY or GOOGLE_API_KEY in Settings > Secrets and variables > Actions."
            exit 2
          fi
          mkdir -p "$VERTICALS_HOME/drafts" "$VERTICALS_HOME/media"

      - name: Generate a draft without uploading
        env:
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite' }}
        run: |
          set -euo pipefail
          ARGS=(--niche "$NICHE" --platform shorts --provider gemini --context "$CONTEXT")
          if [ -n "$TOPIC" ]; then
            ARGS+=(--topic "$TOPIC")
          else
            ARGS+=(--discover --auto-pick)
          fi
          # The draft step runs the no-personal-names check on the script + metadata
          # BEFORE any b-roll/voice/render work (one automatic rewrite with feedback,
          # then exit 3 with DYPOL_FAILURE_CATEGORY=content_gate). REVIEWER_FEEDBACK
          # (job env) is injected into the script prompt.
          python -m verticals draft "${ARGS[@]}"
          DRAFT=$(ls -t "$VERTICALS_HOME"/drafts/*.json 2>/dev/null | head -n 1 || true)
          if [ -z "$DRAFT" ]; then
            echo "::error::Draft generation completed without a draft JSON file."
            exit 1
          fi
          # Kokoro-82M brand voice; falls back to Edge TTS automatically on any failure.
          python -m verticals produce --draft "$DRAFT" --lang "$LANGUAGE" --voice kokoro
          CAPTION=$(find "$VERTICALS_HOME/media" -type f -name '*.srt' -print -quit)
          if [ -z "$CAPTION" ]; then echo "::error::Caption file missing; blocking draft handoff."; exit 1; fi
          # Safety net: final metadata + burned-in captions after render.
          python scripts/validate_no_personal_names.py --draft "$DRAFT" --captions "$CAPTION"
          echo "No-personal-names gate passed; human review remains required. No YouTube upload was run."

      - name: Save durable handoff record
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DRAFT=$(ls -t "$VERTICALS_HOME"/drafts/*.json 2>/dev/null | head -n 1 || true)
          if [ -z "$DRAFT" ] || [ ! -f "$DRAFT" ]; then
            echo "::error::Cannot persist handoff: draft file is missing."
            exit 1
          fi
          mkdir -p dypol-drafts
          python3 - "$DRAFT" "$DYPOL_JOB_ID" <<'PY'
          import json, os, sys
          draft_file, job_id = sys.argv[1], sys.argv[2]
          draft = json.load(open(draft_file, encoding="utf-8"))
          snapshot = {
              "job_id": job_id,
              "producing_run_id": os.environ["GITHUB_RUN_ID"],
              "artifact_name": f"draft-{job_id}",
              "draft_file": os.path.basename(draft_file),
              "language": os.environ.get("LANGUAGE", "en"),
              "title": draft.get("youtube_title", ""),
              "topic": draft.get("news", ""),
              "review_required": bool(draft.get("review_required", True)),
              "visual_manifest": draft.get("broll_manifest", ""),
          }
          with open(f"dypol-drafts/{job_id}.json", "w", encoding="utf-8") as f:
              json.dump(snapshot, f, indent=2)
          print(f"Saved handoff record for job {job_id}")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "dypol-drafts/$DYPOL_JOB_ID.json"
          git commit -m "dypol: save draft handoff for $DYPOL_JOB_ID" || true
          git fetch origin "$BRANCH_NAME"
          git rebase "origin/$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Explain full-phase review gate
        if: ${{ inputs.phase == 'full' && (inputs.auto_publish != '1' || inputs.review_required != '0') }}
        run: echo "::notice::The video was generated as a draft only. Upload is blocked unless auto_publish=1 and review_required=0."

      - name: Upload the draft and media for a later publish run
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ inputs.job_id || github.run_id }}
          path: |
            .verticals-runtime/drafts/**
            .verticals-runtime/media/**
          # Drafts are ~100 MB; 3 days keeps the free 500 MB Actions storage from filling.
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

      # Fast console preview: a small 720p H.264 copy (+faststart) in its own uncompressed
      # artifact so the console can stream it instead of the full ~100 MB draft. Never fails the draft.
      - name: Build small preview copy for the console
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p preview
          VIDEO=$(find "$VERTICALS_HOME/media" -type f -name '*.mp4' -printf '%T@ %p\n' 2>/dev/null \
                  | sort -rn | head -n 1 | cut -d' ' -f2- || true)
          if [ -z "$VIDEO" ]; then echo "::warning::no rendered mp4 found; preview skipped"; exit 0; fi
          ffmpeg -nostdin -y -hide_banner -loglevel error -i "$VIDEO" \
            -vf "scale=-2:720,fps=30" -c:v libx264 -preset veryfast -profile:v main -pix_fmt yuv420p \
            -crf 30 -maxrate 700k -bufsize 700k -g 60 \
            -c:a aac -b:a 64k -ac 2 -ar 44100 -movflags +faststart preview/preview_short.mp4 \
            && echo "preview: $(du -h preview/preview_short.mp4 | cut -f1)" \
            || { echo "::warning::preview encode failed"; rm -f preview/preview_short.mp4; }

      - name: Upload console preview artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.job_id || github.run_id }}
          path: preview/
          # Already-compressed mp4: store as-is (zip "stored") so the console can stream it.
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

  publish:
    if: ${{ always() && (inputs.phase == 'publish' || (inputs.phase == 'full' && needs.produce.result == 'success' && inputs.auto_publish == '1' && inputs.review_required == '0')) }}
    needs: [produce]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      VERTICALS_HOME: ${{ github.workspace }}/.verticals-runtime
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      DYPOL_JOB_ID: ${{ inputs.job_id || github.run_id }}
      PHASE: ${{ inputs.phase || 'draft' }}
      REQUESTED_DRAFT_RUN_ID: ${{ inputs.draft_run_id || '' }}
      REQUESTED_JOB_ID: ${{ inputs.job_id || '' }}
      PRIVACY: ${{ inputs.privacy || 'private' }}
      LANGUAGE: ${{ inputs.language || 'en' }}
      TITLE_OVERRIDE: ${{ inputs.title_override || '' }}
      DESCRIPTION_OVERRIDE: ${{ inputs.description_override || '' }}
      TAGS_OVERRIDE: ${{ inputs.tags_override || '' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Speed: the old setup-python pip cache restored ~3.5 GB (~40 s) and then still
      # spent ~50 s in pip install. Caching the installed virtualenv skips both on a hit.
      - name: Cache Python virtualenv (CPU torch + requirements)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/.venv-dypol
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-torchcpu-v1

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies and compile-check
        env:
          VENV_CACHE_HIT: ${{ steps.venv-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${VENV_CACHE_HIT:-}" != "true" ]; then
            python -m venv ~/.venv-dypol
            ~/.venv-dypol/bin/python -m pip install --upgrade pip
            # CPU-only torch for Whisper: far smaller/faster than the default CUDA wheels.
            ~/.venv-dypol/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
            ~/.venv-dypol/bin/pip install -r requirements.txt
          else
            echo "Restored cached virtualenv; pip install skipped."
          fi
          echo "$HOME/.venv-dypol/bin" >> "$GITHUB_PATH"
          ~/.venv-dypol/bin/python -m compileall -q verticals scripts

      - name: Resolve the exact producing run
        id: locate
        run: |
          set -euo pipefail
          if ! [[ "$DYPOL_JOB_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::DYPOL job_id may contain only letters, numbers, dot, underscore, and hyphen."
            exit 2
          fi
          if [ "$PHASE" = "full" ]; then
            PRODUCING_RUN="$GITHUB_RUN_ID"
            DRAFT_SOURCE="same-run"
          elif [ -f "dypol-drafts/$DYPOL_JOB_ID.json" ]; then
            PRODUCING_RUN=$(python3 -c "import json; print(json.load(open('dypol-drafts/$DYPOL_JOB_ID.json'))['producing_run_id'])")
            DRAFT_SOURCE="durable-snapshot"
          elif [ -n "$REQUESTED_DRAFT_RUN_ID" ] && [ -n "$REQUESTED_JOB_ID" ]; then
            PRODUCING_RUN="$REQUESTED_DRAFT_RUN_ID"
            DRAFT_SOURCE="explicit-run-id"
          else
            echo "::error::No saved draft record found. Supply BOTH the original job_id and draft_run_id, or create a new draft first."
            exit 2
          fi
          if ! [[ "$PRODUCING_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::The producing run ID is invalid."
            exit 2
          fi
          echo "producing_run=$PRODUCING_RUN" >> "$GITHUB_OUTPUT"
          echo "draft_source=$DRAFT_SOURCE" >> "$GITHUB_OUTPUT"

      - name: Download the exact saved draft and its media
        uses: actions/download-artifact@v4
        with:
          name: draft-${{ inputs.job_id || github.run_id }}
          run-id: ${{ steps.locate.outputs.producing_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .verticals-runtime

      - name: Restore YouTube OAuth token
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::error::YOUTUBE_TOKEN_JSON secret is missing; upload was not attempted."
            exit 2
          fi
          mkdir -p "$VERTICALS_HOME"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$VERTICALS_HOME/youtube_token.json"
          chmod 600 "$VERTICALS_HOME/youtube_token.json"

      - name: Locate and validate the approved draft
        id: draft
        run: |
          set -euo pipefail
          EXPECTED="$VERTICALS_HOME/drafts"
          DRAFT="$EXPECTED/$(
            python3 - "$DYPOL_JOB_ID" "$VERTICALS_HOME" <<'PY'
          import json, os, sys
          job_id, home = sys.argv[1], sys.argv[2]
          snapshot_path = os.path.join("dypol-drafts", job_id + ".json")
          if os.path.isfile(snapshot_path):
              print(json.load(open(snapshot_path, encoding="utf-8")).get("draft_file", ""))
          else:
              files = sorted(
                  [f for f in os.listdir(os.path.join(home, "drafts")) if f.endswith(".json")],
                  key=lambda f: os.path.getmtime(os.path.join(home, "drafts", f)),
                  reverse=True,
              )
              print(files[0] if files else "")
          PY
          )"
          if [ ! -f "$DRAFT" ]; then
            echo "::error::The saved draft JSON is missing at $DRAFT. No upload was attempted."
            exit 2
          fi
          python3 scripts/apply_draft_overrides.py --draft "$DRAFT" --lang "$LANGUAGE" --validate
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "DRAFT=$DRAFT" >> "$GITHUB_ENV"

      - name: Apply reviewed metadata and show insert-body preview
        run: |
          set -euo pipefail
          python3 scripts/apply_draft_overrides.py --draft "$DRAFT" --lang "$LANGUAGE" --apply \
            --title "$TITLE_OVERRIDE" \
            --description "$DESCRIPTION_OVERRIDE" \
            --tags "$TAGS_OVERRIDE" \
            --privacy "$PRIVACY" \
            --print-insert-body

      - name: Block upload if reviewed text contains personal names
        run: |
          set -euo pipefail
          CAPTIONS=()
          while IFS= read -r -d '' FILE; do CAPTIONS+=(--captions "$FILE"); done < <(find "$VERTICALS_HOME/media" -type f \( -name '*.srt' -o -name '*.vtt' \) -print0)
          python scripts/validate_no_personal_names.py --draft "$DRAFT" "${CAPTIONS[@]}" 2>&1 | tee -a "$RUNNER_TEMP/dypol-publish.log"

      - name: Upload the reviewed video to YouTube
        env:
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy || 'private' }}
        run: |
          set -euo pipefail
          python -m verticals upload --draft "$DRAFT" --lang "$LANGUAGE" 2>&1 | tee -a "$RUNNER_TEMP/dypol-publish.log"

      - name: Write verified upload result
        if: always()
        env:
          PRODUCING_RUN_ID: ${{ steps.locate.outputs.producing_run }}
          DRAFT_SOURCE: ${{ steps.locate.outputs.draft_source }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          DRAFT="${DRAFT:-}"
          if [ -n "$DRAFT" ] && [ -f "$DRAFT" ]; then
            python3 scripts/report_upload.py \
              --draft "$DRAFT" \
              --job-id "$DYPOL_JOB_ID" \
              --run-id "$RUN_ID" \
              --producing-run-id "$PRODUCING_RUN_ID" \
              --draft-source "$DRAFT_SOURCE" \
              --out "dypol-results/$RUN_ID.json" || true
          fi
          if [ -f "dypol-results/$RUN_ID.json" ]; then
            mkdir -p upload-backup
            cp "dypol-results/$RUN_ID.json" upload-backup/upload_result.json
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "dypol-results/$RUN_ID.json"
            git commit -m "dypol: verified upload result for $RUN_ID" || true
            BRANCH_NAME="${GITHUB_REF_NAME}"
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          elif [ "$JOB_STATUS" != "success" ]; then
            # Failed publish: record why (failure_category + redacted log tail) for the console.
            python3 scripts/report_failure.py \
              --job-id "$DYPOL_JOB_ID" --run-id "$RUN_ID" --phase "$PHASE" \
              --log "$RUNNER_TEMP/dypol-publish.log" \
              --default-category publish \
              --extra "producing_run_id=$PRODUCING_RUN_ID" --extra "draft_source=$DRAFT_SOURCE" \
              --out "dypol-results/$RUN_ID.json"
            mkdir -p upload-backup
            cp "dypol-results/$RUN_ID.json" upload-backup/upload_result.json
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "dypol-results/$RUN_ID.json"
            git commit -m "dypol: failed publish result for $RUN_ID" || true
            BRANCH_NAME="${GITHUB_REF_NAME}"
            git fetch origin "$BRANCH_NAME"
            git rebase --autostash "origin/$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          else
            echo "No verified upload ID found; no result file was written."
          fi

      - name: Back up result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-result-${{ github.run_id }}
          path: upload-backup/
          retention-days: 14
          if-no-files-found: ignore
